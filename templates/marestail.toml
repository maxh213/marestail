[git]
base = "origin/master"

# [agent]
# backend = "claude"  # claude | agy | grok | cursor

[python]
root = "server"
venv = ".venv"
sources = ["."]
crap_max = 4
mutation_workers = 4

[ts]
root = "client/app"
source = "src"
crap_max = 4

[elixir]
mutation = false
muex_optimize = true
root = "."
crap_max = 4

[sonar]
project_key = "change-me"
project_name = "Change Me"

[deadcode]
min_confidence = 60
python_ignore_names = []
ts_kinds = ["files", "exports", "types"]

[docs]
files = ["README.md"]
routes_file = "README.md"
sources = ["server", "client/app/src"]
path_prefixes = ["server/", "client/", "documentation/", "tasks/"]
ignore_env = []

[comments]
paths = ["server", "client/app"]

[qa]
cmd = "npx playwright test"
cwd = "client/app"
