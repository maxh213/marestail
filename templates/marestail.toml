[git]
base = "origin/master"

# [agent]
# backend = "claude"  # claude | agy | grok | cursor | kilo | kimi
# model = "claude-opus-5"  # or dandelion/route / dandelion/route-best: ask dandelion before every session, which picks backend, model and effort
# effort = "high"  # reasoning effort or variant; stamped on every commit

# [practices]
# enabled = true  # the practices judge runs between architect and perf unless false; skips repos with no guidance/*.md

# [perf]
# enabled = true  # the perf judge runs between architect and hardener unless false
# threshold_percent = 10  # a change smaller than this is unchanged
# min_runs = 10  # samples per tree per target
# values_per_sample = 200  # request timings each sample must report in "values"
# p95_min_values = 200  # pooled values per tree before p95 is classified
# min_change = { ms = 1 }  # absolute change per unit below which nothing is flagged
# bootstrap = 500  # resampling rounds for the confidence interval of each change
# control = false  # true measures the baseline commit twice and requires changes to exceed that noise
# sample_timeout = 600  # seconds per sample, excluding the database reset
# setup = ""  # command run in each extra worktree, e.g. "uv sync"

# [perf.db]
# migrate = ""  # brings an empty bench database to a tree's schema; enables marestail perf run --db
# url_env = "DATABASE_URL"
# rows = 50000000  # minimum rows per table; 0 for an empty database; MARESTAIL_PERF_DB_ROWS overrides
# migrations = []  # globs of schema files for the golden cache key; empty uses the commit
# skip_tables = ["schema_migrations", "alembic_version", "ar_internal_metadata", "__EFMigrationsHistory"]
# image = ""  # empty uses the repo's postgres image (compose, workflows, .tool-versions), else postgres:18
# port = 55432  # head; baseline +1, pre-marestail +2
# min_free_gb = 50  # free space required before a golden build with no earlier golden to estimate from

[python]
root = "server"
venv = ".venv"
sources = ["."]
crap_max = 4
mutation_workers = 4

[ts]
root = "client/app"
source = "src"
crap_max = 4
runner = "vitest"  # or "jest" for a Next.js repo; then list sources = ["app", "components", "lib"]

[elixir]
preset = ""
deadcode_ignore_modules = []
deadcode_ignore = []
muex_optimize = true
# muex_mirror = []  # extra top-level dirs muex symlinks into mutation sandboxes, e.g. ["connector"]
root = "."
crap_max = 4

[ruby]
root = "."
crap_max = 4
sources = ["app", "lib"]

[erlang]
root = "."
crap_max = 4
sources = ["src"]
test_dirs = ["test", "tests"]
# mutation_max = 0  # cap mutants checked per run; 0 = no cap

[dotnet]
root = "."
project = "App.csproj"
test_project = "App.Tests/App.Tests.csproj"
coverage_exclude = ["Program.cs"]
crap_max = 4

[rust]
root = "."
sources = ["src"]
crap_max = 4
mutation_jobs = 2
# clippy_args = ["-D", "warnings", "-D", "clippy::pedantic"]
# coverage_ignore_regex = "src/main\\.rs$"  # also skipped by rs.crap

[java]
root = "."  # the Maven module that holds pom.xml
sources = ["src/main/java"]
tests = ["src/test/java"]
coverage_exclude = []  # also skipped by java.mutation unless mutation_exclude is set, e.g. ["src/main/java/com/acme/Application.java"]
crap_max = 4
mutation_threads = 2
# mvn = "./mvnw"  # default: ./mvnw when it exists, else mvn
# release = "21"  # default: maven.compiler.release from pom.xml
# pmd_ruleset = "pmd-ruleset.xml"  # default: marestail's quickstart rules plus CyclomaticComplexity
# jacoco_version = "0.8.15"


[sonar]
project_key = "change-me"
project_name = "Change Me"
exclusions = []  # ant globs on top of the defaults; a [dotnet] repo has no sonar-project.properties

[deadcode]
min_confidence = 60
python_ignore_names = []
ts_kinds = ["files", "exports", "types"]

[docs]
files = ["README.md"]
routes_file = "README.md"
sources = ["server", "client/app/src"]
path_prefixes = ["server/", "client/", "documentation/", "tasks/"]
ignore_env = []

[comments]
paths = ["server", "client/app"]

[qa]
cmd = "npx playwright test"
cwd = "client/app"
