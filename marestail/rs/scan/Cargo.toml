[package]
name = "marestail-rs-scan"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "marestail-rs-scan"
path = "main.rs"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }

[profile.release]
debug = false
